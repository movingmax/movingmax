<style>

:root {
  --bg: #121019;

* { box-sizing: border-box; }

body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button, a { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

.hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left)); display: grid; gap: 8px; pointer-events: none; text-shadow: 0 1px 6px rgba(0,0,0,.45); }

.hud-top { display: grid; grid-template-columns: 44px 1fr 44px; align-items: start; }

.hud-btn svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.km { text-align: center; font-family: var(--font-display); font-weight: 800; line-height: .9; }
.km b { display: block; font-size: clamp(2.6rem, 11vw, 3.6rem); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.km span { display: block; margin-top: 4px; font-size: .95rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .92; }
.bars { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 520px; width: 100%; margin: 0 auto; }
.bar { display: grid; gap: 3px; }
.bar label { font-family: var(--font-display); font-weight: 700; font-size: .82rem; letter-spacing: .14em; text-transform: uppercase; }
.track { height: 12px; border-radius: 6px; background: rgba(18,16,25,.6); overflow: hidden; border: 1px solid rgba(255,255,255,.28); }
.fill { height: 100%; width: 100%; border-radius: 5px; transform-origin: left center; }
#fillE { background: var(--energy); }
#fillA { background: var(--awake); }
.bar.low .track { border-color: #ff5a5a; animation: low .5s steps(2) infinite; }
.bar.low .fill { background: #ff5a5a !important; }
@keyframes low { 50% { opacity: .45; } }
.route { max-width: 520px; width: 100%; margin: 0 auto; height: 3px; border-radius: 2px; background: rgba(255,255,255,.28); position: relative; }
.route i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: #fff; width: 0; }
.toast { position: absolute; left: 0; right: 0; top: 31%; text-align: center; font-family: var(--font-display); font-weight: 800; text-transform: uppercase; font-size: clamp(1.5rem, 7vw, 2.4rem); letter-spacing: .04em; line-height: 1; pointer-events: none; opacity: 0; text-shadow: 0 2px 14px rgba(0,0,0,.6); }
.toast small { display: block; font-size: .5em; letter-spacing: .2em; margin-bottom: 6px; color: #fff; opacity: .85; }
.toast.show { animation: toast 2.2s ease-out both; }
@keyframes toast { 0% { opacity: 0; transform: translateY(14px) scale(.96); } 12%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-10px); } }

/* Overlays */
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); background: rgba(18,16,25,.62); overflow-y: auto; }

.card .label { font-family: var(--font-display); font-weight: 700; font-size: .85rem; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }

.card h1 em { font-style: normal; color: var(--accent); }
.card p { margin: 0; color: var(--muted); line-height: 1.45; }
.card p strong { color: var(--text); font-weight: 600; }
.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; text-align: left; }

.btns { display: grid; gap: 10px; }

      if (DECO[o.type]) { if (x < -s * 3 || x > W + s * 3) continue; DECO[o.type](x, y, s, o, time, night); continue; }
      if (o.type === "pot") drawPot(x, y, s);
      else if (o.type === "barrier") drawBarrier(x, y, s, time + o.v * 3);
      else if (o.type === "truck") drawTruck(x, y, s, time + o.v * 3);
      else {
        var bob = Math.sin(time * 5 + o.z * .3) * s * .05, col = o.type === "can" ? "rgba(255,210,63,.9)" : o.type === "tent" ? "rgba(163,91,255,.9)" : "rgba(255,255,255,.85)";
        if (o.type === "tent") drawTent(x, y, s, time);
        else { glow(x, y - s * .38, s * .62, col, .5); ctx.fillStyle = "rgba(0,0,0,.22)"; ell(x, y, s * .2, s * .05); ctx.fill(); var iy = y - s * .2 + bob; if (o.type === "bear") drawBear(x, iy, s, o.v); else if (o.type === "bottle") drawBottle(x, iy, s); else drawCan(x, iy, s); }
      }
    }
    ctx.globalAlpha = 1;
    var lean = clamp((lane - riderX) * .32, -.3, .3), slump = state === "dying" ? 1 - dieT : 0;
    if (state === "dying" && dieWhy === "energy") lean += slump * .5;
    var blink = inv > 0 && state === "play" && Math.floor(time * 14) % 2 ? .35 : 1;
    drawRider(X(riderX, 1), base, U, state === "pause" ? 0 : time * clamp(v / 30, .3, 1.6), lean, blink, slump);
    var k;
    for (k = 0; k < parts.length; k++) { var pa = parts[k]; if (pa.t < 0) continue; ctx.globalAlpha = clamp(1 - pa.t / .7, 0, 1); ctx.fillStyle = pa.col; ell(pa.x, pa.y, pa.r, pa.r); ctx.fill(); }
    ctx.textAlign = "center";
    for (k = 0; k < pops.length; k++) { var po = pops[k]; ctx.globalAlpha = clamp(1 - po.t / .9, 0, 1); ctx.font = "800 " + Math.round(U * .3) + "px " + FONT; ctx.lineWidth = 4; ctx.strokeStyle = "rgba(18,16,25,.7)"; ctx.strokeText(po.text, po.x, po.y); ctx.fillStyle = po.col; ctx.fillText(po.text, po.x, po.y); }
    ctx.globalAlpha = 1;
    ctx.restore();
    // Effekte über dem Bild
    if (flash > 0) { ctx.fillStyle = "rgba(255,60,60," + (flash * .28).toFixed(3) + ")"; ctx.fillRect(0, 0, W, H); }
    if ((state === "play" || state === "dying") && energy < 25) { var ga = (25 - energy) / 25 * (.35 + .2 * Math.sin(time * 8)); var vg = ctx.createRadialGradient(cx, H * .55, H * .25, cx, H * .55, H * .8); vg.addColorStop(0, "rgba(255,40,40,0)"); vg.addColorStop(1, "rgba(255,40,40," + ga.toFixed(3) + ")"); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H); }
    var lid = 0;
    if (state === "play" && awake < 30) lid = (30 - awake) / 30 * (.22 + .78 * Math.pow(Math.max(0, Math.sin(time * 1.9)), 4)) * .4;
    if (state === "dying" && dieWhy === "awake") lid = lerp(.3, .52, 1 - dieT);
    if (state === "sleep") lid = .52;
    if (lid > 0) {
      var lh = H * lid, g1 = ctx.createLinearGradient(0, 0, 0, lh + 40); g1.addColorStop(0, "#07060c"); g1.addColorStop(lh / (lh + 40), "#07060c"); g1.addColorStop(1, "rgba(7,6,12,0)"); ctx.fillStyle = g1; ctx.fillRect(0, 0, W, lh + 40);
      var g2 = ctx.createLinearGradient(0, H, 0, H - lh - 40); g2.addColorStop(0, "#07060c"); g2.addColorStop(lh / (lh + 40), "#07060c"); g2.addColorStop(1, "rgba(7,6,12,0)"); ctx.fillStyle = g2; ctx.fillRect(0, H - lh - 40, W, lh + 40);
    }
    if (state === "sleep") { ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.font = "800 " + Math.round(Math.min(W * .12, 60)) + "px " + FONT; ctx.fillText("Z z z", cx, H * .47); ctx.font = "700 " + Math.round(Math.min(W * .055, 26)) + "px " + FONT; ctx.fillStyle = "#a35bff"; ctx.fillText(T.rested.toUpperCase(), cx, H * .54); }
    // dunkler Verlauf oben, damit die Anzeige immer lesbar bleibt
    if (state !== "menu") { var tg = ctx.createLinearGradient(0, 0, 0, Math.min(190, H * .26)); tg.addColorStop(0, "rgba(18,16,25,.55)"); tg.addColorStop(1, "rgba(18,16,25,0)"); ctx.fillStyle = tg; ctx.fillRect(0, 0, W, Math.min(190, H * .26)); }
    // HUD
    if (state === "play" || state === "sleep" || state === "dying" || state === "pause") {
      var kt = fmt(Math.floor(km)); if (kt !== lastKmText) { $("km").textContent = kt; lastKmText = kt; }
      $("fillE").style.transform = "scaleX(" + clamp(energy / 100, 0, 1).toFixed(3) + ")"; $("fillA").style.transform = "scaleX(" + clamp(awake / 100, 0, 1).toFixed(3) + ")";
      $("barE").classList.toggle("low", energy < 25); $("barA").classList.toggle("low", awake < 25);
      $("routeFill").style.width = (km / TOTAL * 100).toFixed(2) + "%";
      if ($("stageName").textContent !== curStage.name) $("stageName").textContent = curStage.name;
    }
  }
  var last = 0;
  function frame(ts) {
    var dt = last ? Math.min(.05, (ts - last) / 1000) : .016; last = ts;
    if (state !== "pause") update(dt);
    render();
    requestAnimationFrame(frame);
  }

  // ---------- Steuerung ----------
  function move(dir) { if (state !== "play") return; var n = clamp(lane + dir, -1, 1); if (n !== lane) { lane = n; snd("move"); } }
  var pid = null, px0 = 0, swiped = false;
  cv.addEventListener("pointerdown", function (e) { pid = e.pointerId; px0 = e.clientX; swiped = false; e.preventDefault(); });
  cv.addEventListener("pointermove", function (e) { if (e.pointerId !== pid || swiped) return; var dx = e.clientX - px0; if (Math.abs(dx) > 26) { move(dx > 0 ? 1 : -1); swiped = true; px0 = e.clientX; } });
  function up(e) { if (e.pointerId !== pid) return; if (!swiped) move(e.clientX < W / 2 ? -1 : 1); pid = null; }
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", function () { pid = null; });
  window.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { move(-1); e.preventDefault(); }
    else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { move(1); e.preventDefault(); }
    else if (e.key === "Escape" || e.key === "p" || e.key === "P") { if (state === "pause") resume(); else pause(); }
    else if ((e.key === " " || e.key === "Enter") && e.target.tagName !== "BUTTON" && e.target.tagName !== "A") { if (state === "menu" || state === "over" || state === "win") start(); else if (state === "pause") resume(); e.preventDefault(); }
  });
  $("btnStart").addEventListener("click", start); $("btnAgain").addEventListener("click", start);
  $("btnPause").addEventListener("click", pause); $("btnResume").addEventListener("click", resume);
  document.addEventListener("visibilitychange", function () { if (document.hidden) pause(); });
  $("btnShare").addEventListener("click", function () {
    var txt = T.shareText.replace("{km}", fmt(km)), url = "https://movingmax.cc/spiel.html" + (EN ? "?lang=en" : ""), b = $("btnShare");
    if (navigator.share) navigator.share({ text: txt, url: url }).catch(function () {});
    else if (navigator.clipboard) navigator.clipboard.writeText(txt + " " + url).then(function () { b.textContent = T.copied; }, function () {});
  });

  // ---------- Ton ----------
  var ac = null, muted = false;
  try { muted = localStorage.getItem("mm_spiel_mute") === "1"; } catch (e) {}
  function ensureAudio() { if (ac || muted) return; try { var A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A(); } catch (e) {} if (ac && ac.state === "suspended") ac.resume(); }
  function tone(f0, f1, dur, type, vol, delay) {
    if (!ac || muted) return; var t0 = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .01); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
    o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + dur + .02);
  }
  function snd(k) {
    if (k === "move") tone(300, 360, .05, "triangle", .04);
    else if (k === "eat") { tone(620, 880, .09, "triangle", .12); tone(880, 1180, .1, "triangle", .1, .07); }
    else if (k === "can") { tone(300, 1400, .22, "sawtooth", .07); tone(1400, 1800, .12, "square", .04, .18); }
    else if (k === "tent") { tone(523, 523, .16, "sine", .12); tone(659, 659, .16, "sine", .12, .14); tone(784, 784, .3, "sine", .12, .28); }
    else if (k === "hit") { tone(160, 50, .22, "square", .14); tone(90, 40, .18, "sawtooth", .1, .03); }
    else if (k === "stage") { tone(440, 440, .1, "triangle", .08); tone(660, 660, .16, "triangle", .08, .1); }
    else if (k === "over") { tone(400, 200, .25, "triangle", .12); tone(260, 110, .45, "triangle", .12, .22); }
    else if (k === "win") { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, f, .22, "triangle", .12, i * .13); }); }
  }
  function soundIcon() { $("wave").setAttribute("d", muted ? "M17 9l5 6M22 9l-5 6" : "M17 9a4 4 0 0 1 0 6"); }
  $("btnSound").addEventListener("click", function () { muted = !muted; try { localStorage.setItem("mm_spiel_mute", muted ? "1" : "0"); } catch (e) {} if (!muted) ensureAudio(); soundIcon(); });
  soundIcon();

  // ---------- Start ----------
  reset(); state = "menu";
  drawLegend(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawLegend);
  requestAnimationFrame(frame);

  // Nur zum Testen: spiel.html#debug
  if (location.hash === "#debug") {
    window.__g = {
      get: function () { return { state: state, km: km, energy: energy, awake: awake, v: v, lane: lane, why: dieWhy, ents: ents.length, decos: decos.length }; },
      jump: function (k, e, a) { reset(); dist = k / KMU; km = k; nextRow = dist + 40; nextDeco = dist; decos = []; for (var z = 8; z < ZS; z += 6) addDeco(z); signIdx = STAGES.length; curStage = stageAt(k); if (e != null) energy = e; if (a != null) awake = a; state = 'play'; document.getElementById('menu').hidden = true; document.getElementById('over').hidden = true; document.getElementById('hud').hidden = false; },
      sim: function (skill, seconds) {
        reset(); state = "play"; var t = 0, react = 0, hits = 0, e0;
        while (state !== "over" && state !== "win" && t < (seconds || 600)) {
          react -= 1 / 60;
          if (react <= 0) {
            react = .1 + (1 - skill) * .35;
            var near = null, row = [];
            ents.forEach(function (e) { if (e.done || e.z < 1.2 || e.z > v * 1.1 || e.type === "finish") return; if (near === null || e.z < near) near = e.z; });
            ents.forEach(function (e) { if (!e.done && near !== null && Math.abs(e.z - near) < 1) row.push(e); });
            var bad = {}, good = null;
            row.forEach(function (e) { if (e.type === "pot" || e.type === "barrier" || e.type === "truck") bad[e.wx] = 1; else good = e.wx; });
            var target = lane;
            if (good !== null && Math.random() < skill) target = good;
            else if (bad[lane] && Math.random() < skill) target = [lane - 1, lane + 1, lane - 2, lane + 2].filter(function (l) { return l >= -1 && l <= 1 && !bad[l]; })[0];
            if (target !== undefined && target !== lane) lane += target > lane ? 1 : -1;
          }
          e0 = energy; update(1 / 60); if (e0 - energy > 10) hits++; t += 1 / 60;
        }
        return { km: Math.round(km), why: state === "win" ? "win" : dieWhy, t: Math.round(t), hits: hits, stage: curStage.name };
      }
    };
  }
})();
