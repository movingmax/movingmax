<style>
/* Verstecktes Spiel: 3 Spuren, Blick von hinten, Etappen der Europaumrundung als Landschaften */
:root {
  --bg: #121019;
  --surface: #1b1824;
  --line: #2c2839;
  --text: #eef1f4;
  --muted: #a6a1b6;
  --accent: #a35bff;
  --accent-strong: #8440f0;
  --energy: #ffd23f;
  --awake: #6fd3ff;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-body); -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button, a { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

/* HUD */
.hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left)); display: grid; gap: 8px; pointer-events: none; text-shadow: 0 1px 6px rgba(0,0,0,.45); }
.hud[hidden] { display: none; }
.hud-top { display: grid; grid-template-columns: 44px 1fr 44px; align-items: start; }
.hud-btn { pointer-events: auto; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(18,16,25,.55); display: grid; place-items: center; cursor: pointer; text-decoration: none; backdrop-filter: blur(4px); }
.hud-btn svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.km { text-align: center; font-family: var(--font-display); font-weight: 800; line-height: .9; }
.km b { display: block; font-size: clamp(2.6rem, 11vw, 3.6rem); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.km span { display: block; margin-top: 4px; font-size: .95rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .92; }
.bars { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 520px; width: 100%; margin: 0 auto; }
.bar { display: grid; gap: 3px; }
.bar label { font-family: var(--font-display); font-weight: 700; font-size: .82rem; letter-spacing: .14em; text-transform: uppercase; }
.track { height: 12px; border-radius: 6px; background: rgba(18,16,25,.6); overflow: hidden; border: 1px solid rgba(255,255,255,.28); }
.fill { height: 100%; width: 100%; border-radius: 5px; transform-origin: left center; }
#fillE { background: var(--energy); }
#fillA { background: var(--awake); }
.bar.low .track { border-color: #ff5a5a; animation: low .5s steps(2) infinite; }
.bar.low .fill { background: #ff5a5a !important; }
@keyframes low { 50% { opacity: .45; } }
.route { max-width: 520px; width: 100%; margin: 0 auto; height: 3px; border-radius: 2px; background: rgba(255,255,255,.28); position: relative; }
.route i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: #fff; width: 0; }
.toast { position: absolute; left: 0; right: 0; top: 31%; text-align: center; font-family: var(--font-display); font-weight: 800; text-transform: uppercase; font-size: clamp(1.5rem, 7vw, 2.4rem); letter-spacing: .04em; line-height: 1; pointer-events: none; opacity: 0; text-shadow: 0 2px 14px rgba(0,0,0,.6); }
.toast small { display: block; font-size: .5em; letter-spacing: .2em; margin-bottom: 6px; color: #fff; opacity: .85; }
.toast.show { animation: toast 2.2s ease-out both; }
.toast.hint { top: 20%; font-size: clamp(1.05rem, 4.6vw, 1.5rem); padding: 0 18px; text-wrap: balance; }
.toast.hint span { display: inline-block; background: rgba(18,16,25,.78); border: 1px solid rgba(255,255,255,.25); border-radius: 6px; padding: 9px 14px 8px; }
.toast.hint.show { animation-duration: 2.8s; }
@keyframes toast { 0% { opacity: 0; transform: translateY(14px) scale(.96); } 12%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-10px); } }

/* Overlays */
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); background: rgba(18,16,25,.62); overflow-y: auto; }
.overlay[hidden] { display: none; }
.card { width: 100%; max-width: 420px; background: rgba(27,24,36,.94); border: 1px solid var(--line); border-radius: 10px; padding: 26px 22px 22px; display: grid; gap: 16px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.card .label { font-family: var(--font-display); font-weight: 700; font-size: .85rem; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
.card h1 { margin: 0; font-family: var(--font-display); font-weight: 800; text-transform: uppercase; font-size: clamp(2.4rem, 11vw, 3.2rem); line-height: .95; text-wrap: balance; }
.card h1 em { font-style: normal; color: var(--accent); }
.card p { margin: 0; color: var(--muted); line-height: 1.45; }
.card p strong { color: var(--text); font-weight: 600; }
.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; text-align: left; }
.rules li { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; color: var(--text); font-size: .98rem; line-height: 1.3; }
.rules canvas { width: 96px; height: 44px; background: rgba(255,255,255,.05); border-radius: 6px; }
.btn { display: block; width: 100%; padding: 15px 18px; border-radius: 6px; border: 1px solid var(--accent-strong); background: var(--accent-strong); color: #fff; font-weight: 600; font-size: 1.05rem; cursor: pointer; text-decoration: none; text-align: center; }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--text); }
.btn[disabled] { opacity: .55; cursor: default; }
.btn:hover { filter: brightness(1.1); }
.btns { display: grid; gap: 10px; }
.score { font-family: var(--font-display); font-weight: 800; font-size: clamp(3.4rem, 17vw, 4.6rem); line-height: .9; font-variant-numeric: tabular-nums; }
.score small { font-size: .38em; letter-spacing: .08em; margin-left: 6px; color: var(--muted); }
.best { font-family: var(--font-display); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: .9rem; color: var(--accent); }
.tiny { font-size: .85rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
#bForm { display: grid; gap: 10px; }
#bForm[hidden] { display: none; }
#bName { width: 100%; padding: 14px 14px; border-radius: 6px; border: 1px solid var(--line); background: #121019; color: var(--text); font: inherit; font-size: 1.05rem; text-align: center; -webkit-user-select: text; user-select: text; }

.rank { list-style: none; margin: 0; padding: 0; display: grid; text-align: left; max-height: 38vh; overflow-y: auto; border-top: 1px solid var(--line); }
.rank li { display: grid; grid-template-columns: 2.2em 1fr auto; gap: 8px; align-items: baseline; padding: 8px 4px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.rank li b { font-family: var(--font-display); font-weight: 800; color: var(--muted); }
.rank li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank li i { font-style: normal; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; }
.rank li.me { background: rgba(163,91,255,.16); }
.rank li.me b, .rank li.me i { color: var(--accent); }
.rank li:nth-child(1) b { color: var(--energy); }
.tiny a { color: var(--muted); }
@media (max-height: 640px) { .card { padding: 18px 18px 16px; gap: 11px; } .rules { gap: 7px; } .rules canvas { height: 38px; } }
@media (prefers-reduced-motion: reduce) { .toast.show { animation-duration: 2.2s; } }
</style>
